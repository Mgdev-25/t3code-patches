# Publishes one store release v<version> for each upstream T3 Code nightly.
# The release holds the Linux x64 server archive and SHA256SUMS: a build with the
# server patches, or a byte-for-byte copy of upstream's archive when no server
# patch applies. It holds the Android APK when a phone patch applies.
# A patch that does not apply is left out and named in PATCHES.json.
name: Nightly

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream nightly tag. Empty picks the newest one.
        required: false
        default: ""
      skip:
        description: Patch IDs to leave out, comma separated, or "all". For tests.
        required: false
        default: ""
      replace:
        description: Publish again when the store already has this release.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      server: ${{ steps.apply.outputs.server }}
      mobile: ${{ steps.apply.outputs.mobile }}
      store_sha: ${{ steps.store.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the store script
        run: node --test scripts/*.test.ts

      - id: plan
        name: Pick the nightly
        env:
          TAG: ${{ inputs.tag }}
          REPLACE: ${{ inputs.replace && '--replace' || '' }}
        run: |
          node scripts/store.ts plan --out "$RUNNER_TEMP/plan.json" ${TAG:+--tag "$TAG"} $REPLACE
          jq -r '"needed=\(.needed)", "tag=\(.tag)", "version=\(.version)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"

      - name: Drop merged PRs from the list
        if: steps.plan.outputs.needed == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          node scripts/store.ts sync --tag "$TAG" --notices "$RUNNER_TEMP/notices.json"
          if ! git diff --quiet -- patches.json patches; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A patches.json patches
            git commit -m "chore: drop the PRs that $TAG holds"
            git push origin HEAD:main
          fi

      - id: store
        name: Record the store commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        if: steps.plan.outputs.needed == 'true'
        run: |
          git init -q "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch -q --no-tags --depth=1 origin "refs/tags/${{ steps.plan.outputs.tag }}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD

      - id: apply
        name: Try each patch
        if: steps.plan.outputs.needed == 'true'
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          node scripts/store.ts apply --src "$RUNNER_TEMP/upstream" --out "$RUNNER_TEMP/apply.json" --skip "$SKIP"
          jq -r '"server=\(.server)", "mobile=\(.mobile)"' "$RUNNER_TEMP/apply.json" >> "$GITHUB_OUTPUT"

      - name: Save the plan
        if: steps.plan.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/notices.json
            ${{ runner.temp }}/apply.json
          retention-days: 3

  # Upstream's Linux x64 CLI archive steps from release.yml and release-desktop.yml,
  # on a standard runner. The checkout is upstream at the tag, with the store in store/.
  server:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && needs.plan.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Check out upstream
        run: |
          git init -q .
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch -q --no-tags --depth=1 origin "refs/tags/${{ needs.plan.outputs.tag }}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.store_sha }}
          path: store

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the patches
        working-directory: store
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          node scripts/store.ts apply --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/apply-server.json" --skip "$SKIP"
          diff <(jq -S .applied "$RUNNER_TEMP/plan/apply.json") <(jq -S .applied "$RUNNER_TEMP/apply-server.json")

      # Upstream's preview builds read the same 4 public T3 Connect values from .env.example.
      - name: Load the public T3 Connect values
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value="$(sed -n "s|^T3CODE_$name=||p" .env.example)"
            test -n "$value" || { echo "::error::.env.example has no T3CODE_$name"; exit 1; }
            echo "T3CODE_$name=$value" >> "$GITHUB_ENV"
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build JS bundle
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          vp run "$script"

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          command -v patchelf || { sudo apt-get update -q && sudo apt-get install -y -q patchelf; }
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      # The values must be the ones that upstream baked into its own archive of this nightly.
      - name: Check the baked T3 Connect values
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          archive="t3-$VERSION-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/ours" "$RUNNER_TEMP/theirs"
          gh release download "$TAG" --repo "$UPSTREAM" --dir "$RUNNER_TEMP" --pattern "$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/theirs" --wildcards '*/t3'
          tar -xzf "release-cli/$archive" -C "$RUNNER_TEMP/ours" --wildcards '*/t3'
          for value in "$T3CODE_CLERK_PUBLISHABLE_KEY" "$T3CODE_CLERK_CLI_OAUTH_CLIENT_ID" "$T3CODE_RELAY_URL"; do
            grep -aqF "$value" "$RUNNER_TEMP"/theirs/*/t3 || { echo "::error::upstream's t3 lacks a value of .env.example"; exit 1; }
            grep -aqF "$value" "$RUNNER_TEMP"/ours/*/t3 || { echo "::error::the built t3 lacks a T3 Connect value"; exit 1; }
          done
          echo "3 T3 Connect values match upstream's archive"

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: release-cli/t3-${{ env.VERSION }}-linux-x64.tar.gz
          compression-level: 0
          retention-days: 3

  # Android release APK of the second app, com.t3tools.t3code.preview, signed with the
  # store key. Upstream's OTA updates are off, so the app changes only with a new APK.
  android:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      # arm64 for the phone, x86_64 for the lab emulator.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,x86_64
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - name: Check out upstream
        run: |
          git init -q .
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch -q --no-tags --depth=1 origin "refs/tags/${{ needs.plan.outputs.tag }}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.store_sha }}
          path: store

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Apply the patches
        working-directory: store
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          node scripts/store.ts apply --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/apply-android.json" --skip "$SKIP"
          diff <(jq -S .applied "$RUNNER_TEMP/plan/apply.json") <(jq -S .applied "$RUNNER_TEMP/apply-android.json")

      - name: Load the public T3 Connect values
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE RELAY_URL; do
            value="$(sed -n "s|^T3CODE_$name=||p" .env.example)"
            test -n "$value" || { echo "::error::.env.example has no T3CODE_$name"; exit 1; }
            echo "T3CODE_$name=$value" >> "$GITHUB_ENV"
          done

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      # The workspace root holds the typecheck tools, @effect/tsgo and vite-plus.
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/monorepo

      # Metro strips types and checks none, so a patch that applies but no longer compiles shows here.
      - name: Typecheck the phone app
        run: pnpm --filter @t3tools/mobile typecheck

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write the Firebase and signing files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" && test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::signing or Firebase secret is missing"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/store.keystore"
          echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Generate the Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          # Android installs an update only when the version code does not go down.
          build="${VERSION##*.}"
          sed -i -E "s/versionCode [0-9]+/versionCode $build/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E 'versionCode|versionName|applicationId' android/app/build.gradle

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/store.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/release-apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-apk/t3code-preview-$VERSION.apk"

      # The upload comes first, so a failed check still leaves the APK to test. Publish takes it only on success.
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-apk/t3code-preview-${{ env.VERSION }}.apk
          compression-level: 0
          retention-days: 3

      - name: Check the APK signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $apksigner"
          if ! out="$("$apksigner" verify --print-certs "release-apk/t3code-preview-$VERSION.apk" 2>&1)"; then
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -E 'certificate (DN|SHA-256)' || { echo "$out"; exit 1; }

  publish:
    needs: [plan, server, android]
    if: ${{ !cancelled() && needs.plan.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.store_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/in

      - name: Collect the server archive
        id: server
        env:
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          mkdir -p out
          archive="t3-$VERSION-linux-x64.tar.gz"
          if [ "$SERVER_RESULT" = success ]; then
            echo "state=built" >> "$GITHUB_OUTPUT"
          else
            [ "$SERVER_RESULT" = skipped ] && echo "state=copied" >> "$GITHUB_OUTPUT" || echo "state=failed" >> "$GITHUB_OUTPUT"
            # A copy stays byte for byte upstream's, so upstream's SHA256SUMS matches it.
            gh release download "$TAG" --repo "$UPSTREAM" --dir out --pattern "$archive" --pattern SHA256SUMS
          fi

      - name: Write the report
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          case "$ANDROID_RESULT" in success) android=built ;; skipped) android=not-needed ;; *) android=failed ;; esac
          node scripts/store.ts report --plan "$RUNNER_TEMP/in/plan/plan.json" --apply "$RUNNER_TEMP/in/plan/apply.json" \
            --notices "$RUNNER_TEMP/in/plan/notices.json" --server "${{ steps.server.outputs.state }}" --android "$android" --out out
          if [ "${{ steps.server.outputs.state }}" = built ]; then
            cp "$RUNNER_TEMP/in/server/t3-$VERSION-linux-x64.tar.gz" out/
            node scripts/store.ts marker --archive "out/t3-$VERSION-linux-x64.tar.gz" --report out/PATCHES.json
            (cd out && sha256sum "t3-$VERSION-linux-x64.tar.gz" > SHA256SUMS)
          fi
          if [ "$android" = built ]; then
            cp "$RUNNER_TEMP/in/android/t3code-preview-$VERSION.apk" out/
            (cd out && sha256sum "t3code-preview-$VERSION.apk" >> SHA256SUMS)
          fi
          (cd out && sha256sum -c SHA256SUMS --ignore-missing)
          ls -l out

      - name: Publish the release
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          latest="$(jq -r .latest "$RUNNER_TEMP/in/plan/plan.json")"
          if [ "$REPLACE" = true ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" --title "$VERSION" --notes-file out/notes.md --latest="$latest" --target main \
            $(find out -maxdepth 1 -type f ! -name notes.md | sort)

      - name: Delete old releases
        run: node scripts/store.ts prune
